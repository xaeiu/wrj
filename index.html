<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffd1dc" />
<title>WRJ Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
  html { background: #ffd5e4; }
  body {
    font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.5) 0 2px, transparent 3px) 0 0/40px 40px,
      radial-gradient(circle at 65% 50%, rgba(255, 255, 255, 0.4) 0 2px, transparent 3px) 0 0/60px 60px,
      linear-gradient(160deg, #ffeef3 0%, #ffe0eb 50%, #ffd5e4 100%);
    color: #6b3a4f;
    min-height: 100dvh;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(env(safe-area-inset-top), 40px) 12px max(env(safe-area-inset-bottom), 16px);
  }

  /* festive bg */
  .floater {
    position: fixed; top: 0; pointer-events: none;
    z-index: 0;
    font-size: 26px;
    opacity: 0.32;
    animation: foodDrift 16s linear infinite;
    transition: opacity 0.4s;
  }
  body.in-game .floater { opacity: 0.16 !important; }
  @keyframes foodDrift {
    0%   { transform: translateY(-10%) translateX(0)    rotate(0deg); }
    25%  { transform: translateY(25vh)  translateX(20px) rotate(180deg); }
    50%  { transform: translateY(50vh)  translateX(-15px) rotate(360deg); }
    75%  { transform: translateY(80vh)  translateX(15px) rotate(540deg); }
    100% { transform: translateY(110vh) translateX(0)    rotate(720deg); }
  }

  /* streamers banner */
  .streamers {
    position: fixed; top: 0; left: 0; right: 0; height: 24px;
    background:
      repeating-linear-gradient(45deg,
        #ff5e8a 0 14px, #ffd1dc 14px 28px, #ffb3c8 28px 42px,
        #ff8fb1 42px 56px, #ffeef3 56px 70px);
    z-index: 5; pointer-events: none;
  }
  .streamers::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
    background: radial-gradient(circle at 12px 0, #ff5e8a 6px, transparent 7px);
    background-size: 24px 100%; background-repeat: repeat-x;
  }

  /* layout shells */
  .screen {
    width: 100%; max-width: 480px;
    flex: 1; display: flex; flex-direction: column;
    position: relative; z-index: 1;
  }

  /* ====== START SCREEN ====== */
  .start { align-items: center; justify-content: center; text-align: center; padding-top: 4vh; }
  .hero-stage {
    position: relative;
    width: min(280px, 72vw); aspect-ratio: 800/600;
    margin-top: 8px;
    margin-bottom: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .hero-wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    animation: heroDance 8s ease-in-out infinite;
    transform-origin: center bottom;
    z-index: 2;
  }
  @keyframes heroDance {
    0%   { transform: translateY(0)    rotate(0deg)  scale(1); }
    12%  { transform: translateY(-10px) rotate(-3deg) scale(1.02); }
    25%  { transform: translateY(0)    rotate(0deg)  scale(1); }
    37%  { transform: translateY(-6px) rotate(4deg)  scale(1.03); }
    50%  { transform: translateY(0)    rotate(0deg)  scale(1); }
    62%  { transform: translateY(-12px) rotate(-2deg) scale(1.01); }
    75%  { transform: translateY(0)    rotate(0deg)  scale(1); }
    87%  { transform: translateY(-4px) rotate(3deg)  scale(1.02); }
    100% { transform: translateY(0)    rotate(0deg)  scale(1); }
  }
  .hero-wrap.spin { animation: heroSpin 0.7s ease-in-out; }
  @keyframes heroSpin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(360deg) scale(1.15); }
    100% { transform: rotate(720deg) scale(1); }
  }
  .hero-wrap img {
    width: 92%; height: 92%;
    object-fit: contain;
    pointer-events: none;
  }
  .sparkle {
    position: absolute;
    animation: twinkle 1.8s ease-in-out infinite, drift 5s ease-in-out infinite;
  }
  .sparkle.s1 { top: -8px; right: 6px; font-size: 28px; animation-delay: 0s, 0s; }
  .sparkle.s2 { bottom: 10px; left: -6px; font-size: 22px; animation-delay: 0.6s, 1s; }
  .sparkle.s3 { top: 28%; left: -16px; font-size: 18px; animation-delay: 1.2s, 2s; }
  .sparkle.s4 { bottom: 28%; right: -12px; font-size: 20px; animation-delay: 0.3s, 3s; }
  .sparkle.s5 { top: -2px; left: 22%; font-size: 16px; animation-delay: 0.9s, 1.5s; }
  .sparkle.s6 { bottom: -2px; right: 28%; font-size: 18px; animation-delay: 1.5s, 2.5s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(1) rotate(0); opacity: 1; }
    50% { transform: scale(1.4) rotate(20deg); opacity: 0.6; }
  }
  @keyframes drift {
    0%, 100% { translate: 0 0; }
    25% { translate: 4px -3px; }
    50% { translate: -3px 4px; }
    75% { translate: 5px 2px; }
  }
  /* burst on tap removed (unused) */
  /* food orbit ring */
  .orbit-ring {
    position: absolute; inset: 0;
    pointer-events: none;
    animation: orbitSpin 18s linear infinite;
  }
  .orbit-ring.reverse { animation-direction: reverse; animation-duration: 24s; }
  @keyframes orbitSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .orbit-emoji {
    position: absolute;
    font-size: 28px;
    /* keep emoji upright by counter-rotating */
    animation: orbitEmojiUpright 18s linear infinite;
    filter: drop-shadow(0 2px 4px rgba(255, 130, 170, 0.3));
  }
  .orbit-ring.reverse .orbit-emoji {
    animation: orbitEmojiUprightR 24s linear infinite;
  }
  @keyframes orbitEmojiUpright {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }
  @keyframes orbitEmojiUprightR {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  /* speech bubble */
  .speech {
    position: absolute;
    background: white;
    color: #6b3a4f;
    padding: 8px 14px;
    border-radius: 16px;
    font-size: 14px; font-weight: 800;
    box-shadow: 0 4px 14px rgba(255, 130, 170, 0.3);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    animation: speechPop 2.4s ease-out forwards;
    z-index: 3;
  }
  .speech::after {
    content: ''; position: absolute;
    width: 12px; height: 12px;
    background: white;
    transform: rotate(45deg);
  }
  .speech.tail-down::after  { bottom: -5px; left: 50%; margin-left: -6px; }
  .speech.tail-up::after    { top: -5px; left: 50%; margin-left: -6px; }
  .speech.tail-right::after { top: 50%; right: -5px; margin-top: -6px; }
  .speech.tail-left::after  { top: 50%; left: -5px; margin-top: -6px; }
  @keyframes speechPop {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; }
  }
  h1.title {
    font-size: clamp(42px, 13vw, 60px);
    font-weight: 900; margin: 0 0 56px; letter-spacing: -1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ff5e8a 0%, #ff8fb1 50%, #ffb3c8 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 4px 12px rgba(255, 130, 170, 0.2);
    animation: titleBounce 2.4s ease-in-out infinite;
    transform-origin: center;
    display: inline-block;
  }
  @keyframes titleBounce {
    0%   { transform: scale(1) rotate(0deg); }
    20%  { transform: scale(1.08) rotate(-2deg); }
    40%  { transform: scale(0.96) rotate(2deg); }
    60%  { transform: scale(1.05) rotate(-1deg); }
    80%  { transform: scale(0.98) rotate(1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .start-btn {
    background: linear-gradient(135deg, #ff5e8a 0%, #ff8fb1 100%);
    color: white; border: none; border-radius: 999px;
    padding: 16px 44px; font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    box-shadow: 0 8px 24px rgba(255, 94, 138, 0.4);
    cursor: pointer; transition: transform 0.15s; font-family: inherit;
  }
  .start-btn:active { transform: scale(0.96); }
  .stats {
    margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .stat-pill {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 999px; padding: 7px 14px;
    font-size: 12px; font-weight: 700; color: #b87090;
    border: 1px solid rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
  }

  /* ====== GAME SCREEN ====== */
  .game { gap: 12px; padding-top: 8px; justify-content: center; }
  .game-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px;
  }
  .icon-btn {
    background: rgba(255, 255, 255, 0.8); border: none; border-radius: 50%;
    width: 38px; height: 38px; font-size: 18px; cursor: pointer;
    color: #b87090; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(255, 130, 170, 0.2);
  }
  .icon-btn.hint-btn {
    position: relative; width: auto; padding: 0 14px 0 12px; gap: 4px;
    font-size: 14px; font-weight: 800; border-radius: 19px;
  }
  .icon-btn.hint-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .hint-count {
    font-size: 13px; font-weight: 800; color: #ff5e8a;
  }
  .progress-bar {
    flex: 1; height: 8px; background: rgba(255, 255, 255, 0.7);
    border-radius: 999px; margin: 0 12px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #ff5e8a, #ffb3c8);
    border-radius: 999px; transition: width 0.4s ease;
  }
  .round-pill {
    background: white; border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 800; color: #ff5e8a;
    box-shadow: 0 2px 8px rgba(255, 130, 170, 0.2);
  }

  .clue-card {
    background: linear-gradient(135deg, #ffffff 0%, #fff5f8 100%);
    border-radius: 20px; padding: 18px 18px;
    box-shadow: 0 6px 18px rgba(255, 130, 170, 0.18);
    border: 2px solid rgba(255, 200, 220, 0.5);
    min-height: 72px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .clue-text {
    font-size: 17px; font-weight: 600; line-height: 1.35;
    color: #6b3a4f; margin: 0;
    text-align: center;
  }

  /* crossword board */
  .board-wrap {
    display: flex; justify-content: center; padding: 6px 0;
  }
  .board {
    display: grid; gap: 4px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(255, 130, 170, 0.15);
  }
  .cell {
    position: relative;
    background: white;
    border: 2px solid #ffd1dc;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: #6b3a4f;
    text-transform: uppercase;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
    cursor: pointer;
  }
  .cell.empty { background: transparent; border: none; pointer-events: none; }
  .cell.highlight { background: #fff0f5; border-color: #ff8fb1; }
  .cell.active { border-color: #ff5e8a; box-shadow: 0 0 0 3px rgba(255, 94, 138, 0.3); transform: scale(1.05); z-index: 2; }
  .cell.filled { background: #fff5f8; border-color: #ff8fb1; }
  .cell.locked { background: #b8eecc; border-color: #5fc97e; color: #2d7a4a; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .cell.pop { animation: pop 0.4s; }

  .actions { display: flex; gap: 8px; padding: 0 4px; }
  .action-btn {
    padding: 12px 24px; border: none; border-radius: 999px;
    background: rgba(255, 255, 255, 0.8); color: #b87090;
    font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(255, 130, 170, 0.15);
    align-self: center;
  }
  .actions .action-btn { flex: 1; align-self: stretch; padding: 12px; }
  .action-btn:active { background: white; }

  /* on-screen keyboard */
  .keyboard {
    width: 100%; max-width: 480px;
    margin-top: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 6px 4px;
  }
  .keyboard-row {
    display: flex; gap: 5px; justify-content: center;
  }
  .key {
    width: 34px; height: 42px;
    border: none; border-radius: 8px;
    background: white;
    color: #6b3a4f;
    font-family: inherit;
    font-size: 17px; font-weight: 800;
    box-shadow: 0 2px 4px rgba(255, 130, 170, 0.25);
    cursor: pointer;
    transition: transform 0.08s, background 0.12s;
    text-transform: uppercase;
    padding: 0;
  }
  .key:active {
    transform: scale(0.9);
    background: #ffeef3;
  }
  .key.backspace {
    width: 56px;
    background: #ff9bbc;
    color: white;
    font-size: 18px;
  }

  /* ====== WIN SCREEN ====== */
  .win { align-items: center; justify-content: center; text-align: center; padding-top: 6vh; }
  .win h2 {
    font-size: 42px; margin: 16px 0 4px;
    background: linear-gradient(135deg, #ff5e8a, #ff8fb1);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; font-weight: 900; letter-spacing: -1px;
  }
  .win-emoji { font-size: 76px; animation: bounce 1s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .win-msg {
    font-size: 16px; color: #b87090; margin: 8px 24px 24px;
    line-height: 1.5; font-weight: 500;
  }
  .win-stats {
    display: flex; gap: 14px; margin: 8px 0 24px;
    background: rgba(255, 255, 255, 0.7);
    padding: 16px 22px; border-radius: 20px;
  }
  .win-stat-num { font-size: 26px; font-weight: 900; color: #ff5e8a; line-height: 1; }
  .win-stat-label {
    font-size: 10px; font-weight: 800; color: #b87090;
    letter-spacing: 1px; text-transform: uppercase; margin-top: 4px;
  }

  /* confetti */
  .confetti {
    position: fixed; top: -20px; pointer-events: none; z-index: 100;
    font-size: 20px; animation: fall 2.5s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  @media (max-height: 700px) {
    .clue-card { min-height: 72px; padding: 12px 14px; }
    .clue-text { font-size: 15px; }
  }
</style>

<body>
<div class="streamers"></div>
<div id="app"></div>

<script>
// ===== WORD POOL =====
let WORD_POOL = [];
let BUBBLE_WORDS = ['TIDAK!', 'MAI!', 'EMCAI!', 'CUBIT!', 'ANCUA!', 'HAYOLOH!', 'JAYUS!', 'TUMBUK!'];
async function loadWords() {
  try {
    const res = await fetch('words.json');
    const data = await res.json();
    // accept both old (flat array) and new ({words, bubbles}) schema
    const list = Array.isArray(data) ? data : (data.words || []);
    if (!Array.isArray(data) && Array.isArray(data.bubbles) && data.bubbles.length) {
      BUBBLE_WORDS = data.bubbles;
    }
    WORD_POOL = [];
    for (const item of list) {
      const ans = item.answer.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (ans.length >= 3 && ans.length <= 16 && /^[A-Z]+$/.test(ans)) {
        WORD_POOL.push({ answer: ans, clue: item.clue });
      }
    }
  } catch (e) {
    WORD_POOL = [{ answer: 'LOVE', clue: 'placeholder' }];
  }
}

// ===== STATE =====
const STATE_KEY = 'wrj_state_v3';
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY));
    if (s && typeof s === 'object') {
      return {
        round: s.round || 0,
        wordsSolved: s.wordsSolved || 0,
        seenAnswers: Array.isArray(s.seenAnswers) ? s.seenAnswers : [],
      };
    }
  } catch {}
  return { round: 0, wordsSolved: 0, seenAnswers: [] };
}
function saveState(s) { localStorage.setItem(STATE_KEY, JSON.stringify(s)); }
let state = loadState();
let game = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== CROSSWORD GENERATOR =====
// Place words on a grid, requiring each word after the first to share a letter
// with an already-placed word. Returns null if it can't fit.
const MAX_GRID = 16;
const HORIZONTAL_MAX = 8; // words longer than this must be placed vertically

function tryGenerate(words) {
  const first = words[0];
  const placed = [];
  const cells = {}; // "r,c" -> char
  // Place first word: horizontal if short, vertical if long
  const firstDir = first.answer.length > HORIZONTAL_MAX ? 'down' : 'across';
  if (firstDir === 'across') {
    const startR = Math.floor(MAX_GRID / 2);
    const startC = Math.floor((MAX_GRID - first.answer.length) / 2);
    if (startC < 0 || startC + first.answer.length > MAX_GRID) return null;
    for (let i = 0; i < first.answer.length; i++) {
      cells[`${startR},${startC + i}`] = first.answer[i];
    }
    placed.push({ ...first, dir: 'across', r: startR, c: startC });
  } else {
    const startR = Math.floor((MAX_GRID - first.answer.length) / 2);
    const startC = Math.floor(MAX_GRID / 2);
    if (startR < 0 || startR + first.answer.length > MAX_GRID) return null;
    for (let i = 0; i < first.answer.length; i++) {
      cells[`${startR + i},${startC}`] = first.answer[i];
    }
    placed.push({ ...first, dir: 'down', r: startR, c: startC });
  }

  for (let wi = 1; wi < words.length; wi++) {
    const word = words[wi];
    const mustBeVertical = word.answer.length > HORIZONTAL_MAX;
    const candidates = [];
    for (let li = 0; li < word.answer.length; li++) {
      const ch = word.answer[li];
      for (const pw of placed) {
        for (let pi = 0; pi < pw.answer.length; pi++) {
          if (pw.answer[pi] !== ch) continue;
          // intersection point in grid coords
          const ir = pw.dir === 'across' ? pw.r : pw.r + pi;
          const ic = pw.dir === 'across' ? pw.c + pi : pw.c;
          const newDir = pw.dir === 'across' ? 'down' : 'across';
          // long words must be vertical
          if (mustBeVertical && newDir !== 'down') continue;
          // start of new word relative to intersection
          let r, c;
          if (newDir === 'across') { r = ir; c = ic - li; }
          else { r = ir - li; c = ic; }
          if (canPlace(word.answer, r, c, newDir, cells, placed)) {
            candidates.push({ r, c, dir: newDir, intersections: countIntersections(word.answer, r, c, newDir, cells) });
          }
        }
      }
    }
    if (candidates.length === 0) return null;
    // prefer placements with more intersections
    candidates.sort((a, b) => b.intersections - a.intersections);
    const chosen = candidates[0];
    for (let i = 0; i < word.answer.length; i++) {
      const r = chosen.dir === 'across' ? chosen.r : chosen.r + i;
      const c = chosen.dir === 'across' ? chosen.c + i : chosen.c;
      cells[`${r},${c}`] = word.answer[i];
    }
    placed.push({ ...word, dir: chosen.dir, r: chosen.r, c: chosen.c });
  }
  return finalizePlacement(placed, cells);
}

function canPlace(word, r, c, dir, cells, placed) {
  const len = word.length;
  // bounds
  if (r < 0 || c < 0) return false;
  if (dir === 'across' && c + len > MAX_GRID) return false;
  if (dir === 'down' && r + len > MAX_GRID) return false;
  if (dir === 'across' && r >= MAX_GRID) return false;
  if (dir === 'down' && c >= MAX_GRID) return false;
  // each letter must either match existing or be empty AND have no perpendicular neighbors (except at intersections)
  for (let i = 0; i < len; i++) {
    const rr = dir === 'across' ? r : r + i;
    const cc = dir === 'across' ? c + i : c;
    const existing = cells[`${rr},${cc}`];
    if (existing && existing !== word[i]) return false;
    if (!existing) {
      // check perpendicular neighbors not part of same line have no letters (would create unwanted adjacency)
      if (dir === 'across') {
        if (cells[`${rr - 1},${cc}`] || cells[`${rr + 1},${cc}`]) return false;
      } else {
        if (cells[`${rr},${cc - 1}`] || cells[`${rr},${cc + 1}`]) return false;
      }
    }
  }
  // ends must not touch another letter on the same line
  if (dir === 'across') {
    if (cells[`${r},${c - 1}`]) return false;
    if (cells[`${r},${c + len}`]) return false;
  } else {
    if (cells[`${r - 1},${c}`]) return false;
    if (cells[`${r + len},${c}`]) return false;
  }
  return true;
}

function countIntersections(word, r, c, dir, cells) {
  let n = 0;
  for (let i = 0; i < word.length; i++) {
    const rr = dir === 'across' ? r : r + i;
    const cc = dir === 'across' ? c + i : c;
    if (cells[`${rr},${cc}`]) n++;
  }
  return n;
}

function finalizePlacement(placed, cells) {
  // compute bounds and shift to 0,0
  let minR = Infinity, minC = Infinity, maxR = -Infinity, maxC = -Infinity;
  for (const k of Object.keys(cells)) {
    const [r, c] = k.split(',').map(Number);
    if (r < minR) minR = r;
    if (c < minC) minC = c;
    if (r > maxR) maxR = r;
    if (c > maxC) maxC = c;
  }
  const rows = maxR - minR + 1;
  const cols = maxC - minC + 1;
  if (rows > MAX_GRID || cols > MAX_GRID) return null;
  // Don't let stacked vertical words make the board taller than the longest
  // vertical word itself — that's the natural height ceiling we want.
  const longestDown = Math.max(0, ...placed.filter(p => p.dir === 'down').map(p => p.answer.length));
  const longestAcross = Math.max(0, ...placed.filter(p => p.dir === 'across').map(p => p.answer.length));
  // Allow at least the longest across word's footprint as a floor.
  const maxRows = Math.max(longestDown, 1);
  if (longestDown > 0 && rows > maxRows) return null;
  // Same idea horizontally — board width shouldn't exceed longest across.
  if (longestAcross > 0 && cols > Math.max(longestAcross, 1)) return null;
  const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
  for (const k of Object.keys(cells)) {
    const [r, c] = k.split(',').map(Number);
    grid[r - minR][c - minC] = cells[k];
  }
  const adjustedPlaced = placed.map(p => ({ ...p, r: p.r - minR, c: p.c - minC }));
  // assign clue numbers: scan top-left to bottom-right, number any cell that starts a word
  const numAt = {};
  let n = 1;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!grid[r][c]) continue;
      const startsAcross = (c === 0 || !grid[r][c - 1]) && c + 1 < cols && grid[r][c + 1];
      const startsDown = (r === 0 || !grid[r - 1][c]) && r + 1 < rows && grid[r + 1][c];
      if (startsAcross || startsDown) {
        numAt[`${r},${c}`] = n++;
      }
    }
  }
  for (const p of adjustedPlaced) {
    p.num = numAt[`${p.r},${p.c}`];
  }
  return { rows, cols, grid, words: adjustedPlaced };
}

function generateRound() {
  const seen = new Set(state.seenAnswers);
  const fresh = WORD_POOL.filter(w => !seen.has(w.answer));
  const seenPool = WORD_POOL.filter(w => seen.has(w.answer));

  // Pick `count` words: prefer fresh, but fill with seen words until count is met.
  // `minSeen` forces at least N seen words to be mixed in (helps intersections).
  // When fresh words exist, always guarantee at least one of them survives the
  // pick — otherwise the final unseen word can be shuffled out of every round and
  // the player can never reach 100% completion.
  // Always place the longest word first so vertical-only words anchor the grid.
  function pickWords(count, minSeen) {
    const freshShuf = shuffle(fresh);
    const seenShuf = shuffle(seenPool);
    const pool = [];
    // start with minSeen seen words to guarantee variety
    pool.push(...seenShuf.slice(0, minSeen));
    // top up from fresh
    for (const w of freshShuf) {
      if (pool.length >= count) break;
      if (!pool.includes(w)) pool.push(w);
    }
    // still short? fill with more seen
    for (const w of seenShuf) {
      if (pool.length >= count) break;
      if (!pool.includes(w)) pool.push(w);
    }
    let picked = shuffle(pool).slice(0, count);
    // guarantee a fresh word stays in: if the slice dropped them all, swap one in
    if (fresh.length && !picked.some(w => !seen.has(w.answer))) {
      picked[picked.length - 1] = freshShuf[0];
    }
    picked.sort((a, b) => b.answer.length - a.answer.length);
    return picked;
  }

  // Build a layout that is guaranteed to contain `anchor` by placing it first —
  // the first word is the grid anchor and is always placeable, so it can never be
  // silently dropped the way a later, non-intersecting word can.
  function tryGenerateWithAnchor(anchor, others, count) {
    const rest = shuffle(others.filter(w => w !== anchor)).slice(0, count - 1);
    // anchor first; remaining words longest-first so long (vertical) words slot in early
    rest.sort((a, b) => b.answer.length - a.answer.length);
    return tryGenerate([anchor, ...rest]);
  }

  const targetCount = 4 + Math.floor(Math.random() * 2); // 4 or 5

  // 1) try all-fresh
  if (fresh.length >= targetCount) {
    for (let attempt = 0; attempt < 60; attempt++) {
      const picked = shuffle(fresh).slice(0, targetCount);
      picked.sort((a, b) => b.answer.length - a.answer.length);
      const layout = tryGenerate(picked);
      if (layout) return layout;
    }
  }

  // 2) try mixing in 1, then 2, then more seen words to help intersections
  for (let extra = 1; extra <= 4; extra++) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const layout = tryGenerate(pickWords(targetCount, extra));
      if (layout) return layout;
    }
  }

  // 3) reduce target count
  for (const ct of [4, 3]) {
    for (let attempt = 0; attempt < 30; attempt++) {
      const layout = tryGenerate(pickWords(ct, 4));
      if (layout) return layout;
    }
  }

  // 4) guaranteed-fresh fallback: anchor a fresh word so it cannot be dropped.
  // Critical when only a few unseen words remain — a short non-intersecting word
  // would otherwise never make it onto the board.
  if (fresh.length) {
    const others = WORD_POOL.filter(w => !fresh.includes(w));
    for (const anchor of shuffle(fresh)) {
      for (const ct of [4, 3, 2]) {
        for (let attempt = 0; attempt < 30; attempt++) {
          const layout = tryGenerateWithAnchor(anchor, others, ct);
          if (layout) return layout;
        }
      }
    }
    // absolute last resort: the fresh word alone (always placeable as anchor)
    const solo = tryGenerate([shuffle(fresh)[0]]);
    if (solo) return solo;
  }

  // 5) last resort: any words from full pool
  for (let attempt = 0; attempt < 50; attempt++) {
    const picked = shuffle(WORD_POOL).slice(0, 3);
    picked.sort((a, b) => b.answer.length - a.answer.length);
    const layout = tryGenerate(picked);
    if (layout) return layout;
  }
  return null;
}

const FOOD_EMOJIS = ['🍜', '🥟', '🍙', '🧋', '🍰', '🍡', '🍣', '🍩', '🍓', '🥐', '🍝', '🍤'];
const STICKERS = ['sticker.png', 'sticker2.png', 'sticker3.png', 'sticker4.png'];

let reactionIdx = 0;
let reactionTimer = null;
let stickerIdx = Math.floor(Math.random() * STICKERS.length);

function renderStart() {
  if (reactionTimer) { clearInterval(reactionTimer); reactionTimer = null; }
  document.body.classList.remove('in-game');

  // build orbit emojis HTML
  const ring1 = FOOD_EMOJIS.slice(0, 6).map((e, i) => {

  }).join('');
  const ring2 = FOOD_EMOJIS.slice(6, 12).map((e, i) => {
    const angle = (i / 6) * 360 + 30;
    return `<span class="orbit-emoji" style="left: 50%; top: 50%; transform-origin: 0 0; transform: rotate(${angle}deg) translate(0, -160px) rotate(-${angle}deg); font-size: 22px;">${e}</span>`;
  }).join('');

  app.innerHTML = `
    <div class="screen start">
      <h1 class="title">WRJ Quiz</h1>
      <div class="hero-stage">
        <div class="orbit-ring">${ring1}</div>
        <div class="orbit-ring reverse">${ring2}</div>
        <div class="hero-wrap" id="hero">
          <span class="sparkle s1">✨</span>
          <span class="sparkle s2">💖</span>
          <span class="sparkle s3">🌸</span>
          <span class="sparkle s4">🎀</span>
          <span class="sparkle s5">💕</span>
          <span class="sparkle s6">⭐</span>
          <img src="${STICKERS[stickerIdx]}" alt="hero" id="heroImg" />
        </div>
      </div>
      <button class="start-btn" id="start">${state.wordsSolved >= WORD_POOL.length && WORD_POOL.length > 0 ? 'Play Again' : 'Start Playing'}</button>
      <div class="stats">
        <div class="stat-pill">⭐ ${state.wordsSolved}/${WORD_POOL.length} words guessed</div>
      </div>
    </div>
  `;
  document.getElementById('start').onclick = () => {
    if (state.wordsSolved >= WORD_POOL.length && WORD_POOL.length > 0) {
      state = { round: 0, wordsSolved: 0, seenAnswers: [] };
      saveState(state);
    }
    startGame();
  };
  document.getElementById('hero').onclick = onHeroTap;

  // auto-show reaction bubble on a loop
  showNextReaction();
  reactionTimer = setInterval(showNextReaction, 2200);
}

function onHeroTap() {
  // skip to next word immediately and reset auto-rotate timer
  showNextReaction();
  if (reactionTimer) clearInterval(reactionTimer);
  reactionTimer = setInterval(showNextReaction, 2200);
}

function showNextReaction() {
  reactionIdx = (reactionIdx + 1) % BUBBLE_WORDS.length;
  showReaction(BUBBLE_WORDS[reactionIdx]);
  // also swap sticker to a different random one
  let next = stickerIdx;
  if (STICKERS.length > 1) {
    while (next === stickerIdx) next = Math.floor(Math.random() * STICKERS.length);
  }
  stickerIdx = next;
  const img = document.getElementById('heroImg');
  if (img) img.src = STICKERS[stickerIdx];
}

function showReaction(text) {
  const stage = document.querySelector('.hero-stage');
  if (!stage) return;
  stage.querySelectorAll('.speech').forEach(n => n.remove());
  const bubble = document.createElement('div');
  bubble.className = 'speech';
  bubble.textContent = text;
  // Bubble always above the sticker
  const positions = [
    { style: 'left: 50%; top: 0; transform: translate(-50%, calc(-100% - 10px));', tail: 'tail-down' },
  ];
  const pos = positions[Math.floor(Math.random() * positions.length)];
  bubble.setAttribute('style', pos.style);
  bubble.classList.add(pos.tail);
  stage.appendChild(bubble);
  // Clamp to viewport, larger margin so it doesn't kiss the edge
  requestAnimationFrame(() => {
    const rect = bubble.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const margin = 16;
    let dx = 0, dy = 0;
    if (rect.left < margin) dx = margin - rect.left;
    else if (rect.right > vw - margin) dx = (vw - margin) - rect.right;
    if (rect.top < margin) dy = margin - rect.top;
    else if (rect.bottom > vh - margin) dy = (vh - margin) - rect.bottom;
    if (dx !== 0 || dy !== 0) {
      const cs = bubble.style.transform || '';
      bubble.style.transform = `${cs} translate(${dx}px, ${dy}px)`;
    }
  });
  setTimeout(() => bubble.remove(), 2400);
}

function startGame() {
  const layout = generateRound();
  if (!layout) {
    alert('Could not build a crossword from the current word pool — try again or add more words.');
    return;
  }
  document.body.classList.add('in-game');
  // initialize per-cell user input
  const userGrid = Array.from({ length: layout.rows }, (_, r) =>
    Array.from({ length: layout.cols }, (_, c) => layout.grid[r][c] ? '' : null)
  );
  game = {
    layout,
    userGrid,
    activeWordIdx: 0,
    activeCell: { r: layout.words[0].r, c: layout.words[0].c },
    solvedWords: new Set(),
    hintsUsed: 0,
    baseViewportH: window.innerHeight,
  };
  renderGame();
}

function renderGame() {
  const { layout } = game;
  const totalWords = layout.words.length;
  const solved = game.solvedWords.size;
  const progress = (solved / totalWords) * 100;
  const activeWord = layout.words[game.activeWordIdx];

  // Unique letters across all words in this round, sorted alphabetically.
  const letterSet = new Set();
  layout.words.forEach(w => { for (const ch of w.answer) letterSet.add(ch); });
  const letters = [...letterSet].sort();
  // Wrap into rows of up to 9 keys; backspace appended to the last row.
  const perRow = 9;
  const rows = [];
  for (let i = 0; i < letters.length; i += perRow) rows.push(letters.slice(i, i + perRow));
  if (rows.length === 0) rows.push([]);

  app.innerHTML = `
    <div class="screen game">
      <div class="game-header">
        <button class="icon-btn" id="back">←</button>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <button class="icon-btn hint-btn" id="hint" ${game.hintsUsed >= 5 ? 'disabled' : ''} title="Reveal letter (${5 - game.hintsUsed} left)">Hint<span class="hint-count">${5 - game.hintsUsed}</span></button>
      </div>
      <div class="clue-card">
        <p class="clue-text">${activeWord.clue}</p>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="keyboard" id="keyboard">
        ${rows.map((row, ri) => `
          <div class="keyboard-row">
            ${row.map(ch => `<button class="key" data-ch="${ch}">${ch}</button>`).join('')}
            ${ri === rows.length - 1 ? `<button class="key backspace" id="keyBack">⌫</button>` : ''}
          </div>`).join('')}
      </div>
    </div>
  `;
  document.getElementById('back').onclick = () => { game = null; renderStart(); };
  document.getElementById('hint').onclick = revealHint;
  document.querySelectorAll('.key[data-ch]').forEach(k => {
    k.onclick = () => handleType(k.dataset.ch);
  });
  document.getElementById('keyBack').onclick = handleBackspace;
  renderBoard();
}

function renderBoard() {
  const { layout, userGrid, activeCell, activeWordIdx } = game;
  const board = document.getElementById('board');
  // size cells responsively
  // Size cells so the board always fits within viewport. Maximize horizontally first.
  const horizPad = 24;
  const innerPad = 20;
  const gap = 4;
  const availW = Math.min(window.innerWidth, 600) - horizPad;
  // Use cached viewport height captured at game start so the on-screen keyboard
  // shrinking innerHeight doesn't keep resizing the board.
  const baseH = game.baseViewportH || window.innerHeight;
  // Compute exact reserved space:
  //   streamers (~24) + page top-padding (~40) + game-header (~50) + clue card (~100)
  //   + safe bottom (~20) = ~234 of fixed chrome.
  // Plus the on-screen keyboard, sized by actual letter count this round.
  const letterCount = new Set(layout.words.flatMap(w => w.answer.split(''))).size;
  const keyboardRows = Math.max(1, Math.ceil(letterCount / 9)); // matches perRow in renderGame
  // Each row: 42px key + 6px gap. Container: 6px top padding + 6px bottom padding + 10px margin-top.
  const keyboardH = keyboardRows * 42 + (keyboardRows - 1) * 6 + 22;
  const availH = baseH - 234 - keyboardH;
  const cellByW = Math.floor((availW - innerPad - (layout.cols - 1) * gap) / layout.cols);
  const cellByH = Math.floor((availH - innerPad - (layout.rows - 1) * gap) / layout.rows);
  // No floor — honor whatever fits both axes. Very tall vertical words may shrink
  // cells small, but better than scrolling.
  const finalCellSize = Math.max(8, Math.min(64, Math.min(cellByW, cellByH)));
  board.style.gridTemplateColumns = `repeat(${layout.cols}, ${finalCellSize}px)`;
  board.style.gridTemplateRows = `repeat(${layout.rows}, ${finalCellSize}px)`;
  board.innerHTML = '';

  const activeWord = layout.words[activeWordIdx];
  const highlightSet = new Set();
  for (let i = 0; i < activeWord.answer.length; i++) {
    const r = activeWord.dir === 'across' ? activeWord.r : activeWord.r + i;
    const c = activeWord.dir === 'across' ? activeWord.c + i : activeWord.c;
    highlightSet.add(`${r},${c}`);
  }

  for (let r = 0; r < layout.rows; r++) {
    for (let c = 0; c < layout.cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.fontSize = Math.round(finalCellSize * 0.5) + 'px';
      const answer = layout.grid[r][c];
      if (!answer) {
        cell.classList.add('empty');
        board.appendChild(cell);
        continue;
      }
      const userCh = userGrid[r][c];
      const isLocked = isCellLocked(r, c);
      if (highlightSet.has(`${r},${c}`)) cell.classList.add('highlight');
      if (activeCell && activeCell.r === r && activeCell.c === c) cell.classList.add('active');
      if (isLocked) {
        cell.classList.add('locked');
        cell.textContent = userCh || answer;
      } else if (userCh) {
        cell.textContent = userCh;
        cell.classList.add('filled');
      }
      cell.onclick = () => onCellTap(r, c);
      board.appendChild(cell);
    }
  }
}

function isCellLocked(r, c) {
  // locked if it belongs to any solved word
  for (const idx of game.solvedWords) {
    const w = game.layout.words[idx];
    for (let i = 0; i < w.answer.length; i++) {
      const wr = w.dir === 'across' ? w.r : w.r + i;
      const wc = w.dir === 'across' ? w.c + i : w.c;
      if (wr === r && wc === c) return true;
    }
  }
  return false;
}

function findFirstEmptyOfWord(idx) {
  const w = game.layout.words[idx];
  for (let i = 0; i < w.answer.length; i++) {
    const r = w.dir === 'across' ? w.r : w.r + i;
    const c = w.dir === 'across' ? w.c + i : w.c;
    if (!game.userGrid[r][c]) return { r, c };
  }
  return null;
}

function onCellTap(r, c) {
  // find words containing this cell; if multiple, prefer one different from current to toggle
  const wordsAtCell = [];
  game.layout.words.forEach((w, i) => {
    for (let k = 0; k < w.answer.length; k++) {
      const wr = w.dir === 'across' ? w.r : w.r + k;
      const wc = w.dir === 'across' ? w.c + k : w.c;
      if (wr === r && wc === c) { wordsAtCell.push(i); break; }
    }
  });
  if (wordsAtCell.length === 0) return;
  if (wordsAtCell.length === 1) {
    game.activeWordIdx = wordsAtCell[0];
  } else {
    // toggle
    const cur = wordsAtCell.indexOf(game.activeWordIdx);
    if (cur === -1) game.activeWordIdx = wordsAtCell[0];
    else game.activeWordIdx = wordsAtCell[(cur + 1) % wordsAtCell.length];
  }
  game.activeCell = { r, c };
  renderGame();
}

function moveCursor(key) {
  if (!game.activeCell) return;
  let { r, c } = game.activeCell;
  const layout = game.layout;
  const try_ = (nr, nc) => {
    if (nr < 0 || nc < 0 || nr >= layout.rows || nc >= layout.cols) return false;
    if (!layout.grid[nr][nc]) return false;
    game.activeCell = { r: nr, c: nc };
    return true;
  };
  if (key === 'ArrowRight') try_(r, c + 1);
  if (key === 'ArrowLeft') try_(r, c - 1);
  if (key === 'ArrowDown') try_(r + 1, c);
  if (key === 'ArrowUp') try_(r - 1, c);
}

function handleType(ch) {
  if (!game.activeCell) return;
  const { r, c } = game.activeCell;
  if (isCellLocked(r, c)) { advanceCursor(); return; }
  game.userGrid[r][c] = ch;
  // advance cursor along active word
  advanceCursor();
  renderBoard();
  checkWordCompletion();
}

function handleBackspace() {
  if (!game.activeCell) return;
  const { r, c } = game.activeCell;
  if (game.userGrid[r][c]) {
    if (!isCellLocked(r, c)) game.userGrid[r][c] = '';
  } else {
    // step back one along active word
    retreatCursor();
    const { r: nr, c: nc } = game.activeCell;
    if (!isCellLocked(nr, nc)) game.userGrid[nr][nc] = '';
  }
  renderBoard();
}

function advanceCursor() {
  const w = game.layout.words[game.activeWordIdx];
  const { r, c } = game.activeCell;
  // find current index within word
  let idx = -1;
  for (let i = 0; i < w.answer.length; i++) {
    const wr = w.dir === 'across' ? w.r : w.r + i;
    const wc = w.dir === 'across' ? w.c + i : w.c;
    if (wr === r && wc === c) { idx = i; break; }
  }
  if (idx === -1) return;
  // advance to next non-locked or any remaining position
  for (let i = idx + 1; i < w.answer.length; i++) {
    const nr = w.dir === 'across' ? w.r : w.r + i;
    const nc = w.dir === 'across' ? w.c + i : w.c;
    game.activeCell = { r: nr, c: nc };
    if (!isCellLocked(nr, nc) && !game.userGrid[nr][nc]) return;
  }
}

function retreatCursor() {
  const w = game.layout.words[game.activeWordIdx];
  const { r, c } = game.activeCell;
  let idx = -1;
  for (let i = 0; i < w.answer.length; i++) {
    const wr = w.dir === 'across' ? w.r : w.r + i;
    const wc = w.dir === 'across' ? w.c + i : w.c;
    if (wr === r && wc === c) { idx = i; break; }
  }
  if (idx <= 0) return;
  const nr = w.dir === 'across' ? w.r : w.r + (idx - 1);
  const nc = w.dir === 'across' ? w.c + (idx - 1) : w.c;
  game.activeCell = { r: nr, c: nc };
}

function checkWordCompletion() {
  const layout = game.layout;
  layout.words.forEach((w, i) => {
    if (game.solvedWords.has(i)) return;
    let complete = true, correct = true;
    for (let k = 0; k < w.answer.length; k++) {
      const r = w.dir === 'across' ? w.r : w.r + k;
      const c = w.dir === 'across' ? w.c + k : w.c;
      const u = game.userGrid[r][c];
      if (!u) complete = false;
      if (u !== w.answer[k]) correct = false;
    }
    if (complete && correct) onWordSolved(i);
  });
}

function onWordSolved(idx) {
  game.solvedWords.add(idx);
  const w = game.layout.words[idx];
  if (!state.seenAnswers.includes(w.answer)) {
    state.seenAnswers.push(w.answer);
    state.wordsSolved = state.seenAnswers.length;
  }
  saveState(state);
  burstConfetti(20);
  // pop animation on cells
  setTimeout(() => {
    document.querySelectorAll('.cell.locked').forEach(el => {
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 400);
    });
  }, 50);

  if (game.solvedWords.size === game.layout.words.length) {
    setTimeout(onRoundComplete, 800);
    return;
  }
  // jump to next unsolved word
  const next = game.layout.words.findIndex((_, i) => !game.solvedWords.has(i));
  if (next !== -1) {
    game.activeWordIdx = next;
    game.activeCell = findFirstEmptyOfWord(next) || { r: game.layout.words[next].r, c: game.layout.words[next].c };
  }
  renderGame();
}

function revealHint() {
  if (game.hintsUsed >= 5) return;
  const w = game.layout.words[game.activeWordIdx];
  // collect indexes where user hasn't filled the correct letter yet
  const candidates = [];
  for (let i = 0; i < w.answer.length; i++) {
    const r = w.dir === 'across' ? w.r : w.r + i;
    const c = w.dir === 'across' ? w.c + i : w.c;
    if (game.userGrid[r][c] !== w.answer[i]) candidates.push(i);
  }
  if (candidates.length === 0) return;
  const i = candidates[Math.floor(Math.random() * candidates.length)];
  const r = w.dir === 'across' ? w.r : w.r + i;
  const c = w.dir === 'across' ? w.c + i : w.c;
  game.userGrid[r][c] = w.answer[i];
  game.hintsUsed++;
  saveState(state);
  const btn = document.getElementById('hint');
  if (btn) {
    const left = 5 - game.hintsUsed;
    btn.innerHTML = `Hint<span class="hint-count">${left}</span>`;
    btn.title = `Reveal letter (${left} left)`;
    if (left <= 0) btn.disabled = true;
  }
  renderBoard();
  checkWordCompletion();
}

function onRoundComplete() {
  state.round++;
  saveState(state);
  // grand finale: every word in the pool has been guessed at some point
  if (state.wordsSolved >= WORD_POOL.length) {
    onAllWordsGuessed();
    return;
  }
  burstConfetti(40);
  startGame();
}

function onAllWordsGuessed() {
  // long confetti shower
  for (let i = 0; i < 5; i++) setTimeout(() => burstConfetti(40), i * 600);
  app.innerHTML = `
    <div class="screen win">
      <div class="win-emoji">👑</div>
      <h2>You Did It!</h2>
      <p class="win-msg">Every single word, guessed.</p>
      <button class="start-btn" id="home">Back to Home</button>
    </div>
  `;
  document.getElementById('home').onclick = () => { game = null; renderStart(); };
}

// init
(async () => {
  await loadWords();
  spawnFloaters();
  renderStart();
})();

// dev helpers — call from console
window.devCompleteAll = () => {
  const all = WORD_POOL.map(w => w.answer);
  state = { ...state, wordsSolved: all.length, seenAnswers: all };
  saveState(state);
  location.reload();
};
window.devAlmostComplete = () => {
  const all = WORD_POOL.map(w => w.answer);
  const allButOne = all.slice(0, -1);
  state = { ...state, wordsSolved: allButOne.length, seenAnswers: allButOne };
  saveState(state);
  location.reload();
};
window.devReset = () => {
  localStorage.removeItem(STATE_KEY);
  location.reload();
};

// on resize (orientation change), re-render the board so cells stay sized properly
window.addEventListener('resize', () => {
  if (game) game.baseViewportH = window.innerHeight;
  if (game && document.querySelector('.board')) renderBoard();
});
</script>
</body>
